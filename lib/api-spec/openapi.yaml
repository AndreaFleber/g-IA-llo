openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for g.IA.llo — gioco di interrogatorio noir
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Game operations
  - name: openai
    description: OpenAI AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /characters:
    get:
      operationId: listCharacters
      tags: [game]
      summary: List all interrogatable characters
      responses:
        "200":
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"

  /interrogations:
    get:
      operationId: listInterrogations
      tags: [game]
      summary: List all interrogation sessions
      responses:
        "200":
          description: List of interrogations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Interrogation"
    post:
      operationId: createInterrogation
      tags: [game]
      summary: Start a new interrogation session for a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterrogationInput"
      responses:
        "201":
          description: Created interrogation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interrogation"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameError"

  /interrogations/{id}:
    get:
      operationId: getInterrogation
      tags: [game]
      summary: Get interrogation with full message history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Interrogation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterrogationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameError"
    delete:
      operationId: deleteInterrogation
      tags: [game]
      summary: Delete an interrogation session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameError"

  /accuse:
    post:
      operationId: submitAccusation
      tags: [game]
      summary: Submit a one-shot accusation — returns verdict without revealing the answer in client code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccusationInput"
      responses:
        "200":
          description: Verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccusationResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameError"

  /interrogations/{id}/messages:
    post:
      operationId: sendInterrogationMessage
      tags: [game]
      summary: Send a question and receive a streaming AI response in character
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: SSE stream of character response chunks
          content:
            text/event-stream: {}
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Character:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        description:
          type: string
        suspicionLevel:
          type: integer
          description: 0-100 suspicion score
      required:
        - id
        - name
        - role
        - description
        - suspicionLevel

    Interrogation:
      type: object
      properties:
        id:
          type: integer
        characterId:
          type: string
        characterName:
          type: string
        conversationId:
          type: integer
        startedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
      required:
        - id
        - characterId
        - characterName
        - conversationId
        - startedAt
        - messageCount

    InterrogationWithMessages:
      type: object
      properties:
        id:
          type: integer
        characterId:
          type: string
        characterName:
          type: string
        conversationId:
          type: integer
        startedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InterrogationMessage"
      required:
        - id
        - characterId
        - characterName
        - conversationId
        - startedAt
        - messages

    InterrogationMessage:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - createdAt

    InterrogationInput:
      type: object
      properties:
        characterId:
          type: string
      required:
        - characterId

    MessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    AccusationInput:
      type: object
      properties:
        suspectId:
          type: string
        motiveId:
          type: string
      required:
        - suspectId
        - motiveId

    AccusationResult:
      type: object
      properties:
        correct:
          type: boolean
      required:
        - correct

    GameError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
